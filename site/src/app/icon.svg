<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="All My Fellas">
  <!--
    The pipeline itself, reduced to what survives at 16px: three nodes on one
    spine, coloured by who owns each stage — accent for an agent, amber for a
    human gate, green for delivery. Same tokens as the dashboard palette.
  -->
  <rect width="32" height="32" rx="7" fill="#0b0d12" />
  <path d="M16 8v16" stroke="#2b3145" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="16" cy="8" r="3.2" fill="#6e8bff" />
  <circle cx="16" cy="16" r="3.2" fill="#e5b454" />
  <circle cx="16" cy="24" r="3.2" fill="#46c98b" />
</svg>
