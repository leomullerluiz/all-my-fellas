# Self-hosted deployment for the VPS phase.
#
# The web and worker run as two services sharing one bind-mounted volume, which
# is what lets them see the same SQLite file and the same task workspaces.
# Serverless is not an option here: agent sessions run for minutes and the
# dashboard holds an SSE connection open.

services:
  web:
    build:
      context: .
      target: runtime
    command: ["node_modules/.bin/next", "start"]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/pipeline.db
      WORKSPACES_DIR: /app/workspaces
    env_file:
      - .env
    volumes:
      - pipeline-data:/app/data
      - pipeline-workspaces:/app/workspaces
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      target: runtime
    command: ["node", "dist/worker/index.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/pipeline.db
      WORKSPACES_DIR: /app/workspaces
    env_file:
      - .env
    volumes:
      - pipeline-data:/app/data
      - pipeline-workspaces:/app/workspaces
    depends_on:
      - web
    # Give the worker time to finish the stage it is running before it is killed.
    stop_grace_period: 5m
    restart: unless-stopped
    # The worker has no HTTP server of its own (§7.4) — it is reported on by
    # `web`'s /api/health, which reads the heartbeat row this container
    # writes. Hitting `web` rather than itself is deliberate: a healthcheck
    # that only proved the container was still running would miss exactly
    # the failure mode this exists to catch (a hung, not crashed, worker).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://web:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pipeline-data:
  pipeline-workspaces:
